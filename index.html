<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dedar Alam | Software Engineer & ML Researcher</title>
    <meta name="description"
        content="Portfolio of Dedar Alam - Software engineer specializing in machine learning, NLP, and data science. View my projects and research papers.">
    <meta name="keywords"
        content="Dedar Alam, Software Engineer, Machine Learning, NLP, Data Science, Python, Portfolio">
    <meta name="author" content="S M Dedar Alam">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Dedar Alam | Software Engineer & ML Researcher">
    <meta property="og:description"
        content="Software engineer specializing in machine learning, NLP, and data science. View my projects and research papers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://smdedar.github.io/">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FAFAFA;
            background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            /* Cleaner off-white */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: #1A1A1A;
            color: #00FF00;
            /* Tech Green highlight */
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            /* Cinematic spacing */
        }

        #description {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .social-link {
            transition: transform 0.2s ease;
        }

        .social-link:hover {
            transform: translateY(-2px);
        }

        .nav-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #1A1A1A;
            /* Hard tech shadow */
        }

        .nav-tag::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #1A1A1A;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .nav-tag:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>

<body class="min-h-screen md:flex md:items-center md:justify-center">
    <main class="container mx-auto px-4 flex flex-col items-center text-center max-w-3xl py-8 md:py-0">
        <div class="relative w-36 h-36 md:w-40 md:h-40 mb-4 animate-fade-in group">
            <div
                class="absolute inset-0 rounded-full border-2 border-gray-200 group-hover:border-gray-900 transition-colors duration-300">
            </div>
            <img id="profile-img" alt="Profile picture" class="rounded-full object-cover w-full h-full p-1" />
        </div>

        <h1 id="name" class="text-3xl md:text-4xl font-bold mb-4 animate-fade-in delay-100"></h1>

        <p id="description" class="text-base md:text-lg text-gray-600 mb-6 max-w-2xl animate-fade-in delay-200"></p>

        <!-- Social Links -->
        <div id="social-links" class="flex flex-wrap justify-center gap-4 mb-8 animate-fade-in delay-300">
            <!-- Social links will be dynamically inserted here -->
        </div>

        <!-- Contribution Graph -->
        <div id="contribution-graph"
            class="w-full mb-8 animate-fade-in delay-300 hidden md:flex flex-col items-center justify-center">
            <!-- Graph will be injected here -->
        </div>



        <!-- Navigation Tags -->
        <div id="navigation-tags" class="flex flex-wrap justify-center gap-2 animate-fade-in delay-400">
            <!-- Navigation tags will be dynamically inserted here -->
        </div>
    </main>
    <script src="js/about.js"></script>
    <script src="js/config.js"></script>
    <script src="js/contributions.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Validate configuration data
            if (!about || typeof about !== "object") {
                console.error("Missing or invalid 'about' configuration.");
                return;
            }
            if (!Array.isArray(socials)) {
                console.error(
                    "Missing or invalid 'socials' configuration.",
                );
                return;
            }
            if (!Array.isArray(tags)) {
                console.error("Missing or invalid 'tags' configuration.");
                return;
            }

            // Set profile image
            const profileImg = document.getElementById("profile-img");
            if (about.image) {
                profileImg.src = about.image;
                profileImg.alt = `Profile picture of ${about.name}`;
            } else {
                console.warn("Profile image is missing in 'about'.");
                profileImg.alt = "Default profile picture";
            }

            // Set document title
            document.title = about.name || "About Me";

            // Set name
            const nameElement = document.getElementById("name");
            const [firstName, ...lastNameParts] = (
                about.name || "Unknown Name"
            ).split(" ");
            nameElement.innerHTML = `<span class="font-medium">${firstName} ${lastNameParts.join(" ")}</span>`;

            // Set description
            const descriptionElement =
                document.getElementById("description");
            descriptionElement.textContent =
                about.description || "No description provided.";

            // Set social links
            const socialNavigationContainer =
                document.getElementById("social-links");
            socials.forEach((link) => {
                if (about[link.key]) {
                    const a = document.createElement("a");
                    a.href = about[link.key];
                    a.className =
                        "text-gray-600 hover:text-black transition-colors social-link";
                    a.target = "_blank";
                    a.rel = "noopener noreferrer"; // Security best practice
                    a.innerHTML = `
            <i data-lucide="${link.icon}" class="w-6 h-6"></i>
            <span class="sr-only">${link.label}</span>
          `;
                    socialNavigationContainer.appendChild(a);
                }
            });

            // Set navigation tags
            const navigationTagsContainer =
                document.getElementById("navigation-tags");
            tags.forEach((tag) => {
                const a = document.createElement("a");
                a.href = `${tag.toLowerCase()}.html`;
                a.className =
                    "bg-white inline-block px-4 py-2 bg-gray-100 text-gray-800 rounded-full hover:bg-gray-200 transition-colors nav-tag";
                a.textContent = tag;
                navigationTagsContainer.appendChild(a);
            });

            // Initialize Lucide icons
            lucide.createIcons();
        });
    </script>
</body>

</html>
