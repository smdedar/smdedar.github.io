<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }

    #content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Chakra Petch', sans-serif;
      color: #333;
    }

    nav a,
    .nav-item {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    pre,
    code {
      font-family: 'JetBrains Mono', monospace;
      background: #f4f4f4;
      padding: 10px;
      display: block;
      border-radius: 5px;
      overflow-x: auto;
    }

    .error-message {
      font-family: 'Space Grotesk', sans-serif;
      color: #e53e3e;
      background-color: #fef2f2;
      border: 1px solid #feb2b2;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }

    /* HUD Nav Styles */
    #navigation-links a {
      position: relative;
      padding-bottom: 2px;
    }

    #navigation-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #a855f7;
      /* Purple-500 */
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }

    #navigation-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Markdown Content Styling (Tailwind Reset Override) */
    #content h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      margin-top: 2rem;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 0.5rem;
    }

    #content h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      margin-top: 1.5rem;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 0.3rem;
    }

    #content h3 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      margin-top: 1.25rem;
    }

    #content h4 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      margin-top: 1rem;
    }

    #content p {
      margin-bottom: 1rem;
    }

    #content ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    #content ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    #content li {
      margin-bottom: 0.25rem;
    }

    #content blockquote {
      border-left: 4px solid #e5e7eb;
      padding-left: 1rem;
      color: #4b5563;
      font-style: italic;
      margin-bottom: 1rem;
    }

    #content a {
      color: #a855f7;
      text-decoration: none;
    }

    #content a:hover {
      text-decoration: underline;
    }

    #content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }

    #content code {
      background-color: #f3f4f6;
      padding: 0.2em 0.4em;
      border-radius: 0.25rem;
      font-size: 85%;
      font-family: 'JetBrains Mono', monospace;
    }

    #content pre code {
      background-color: transparent;
      padding: 0;
      font-size: 100%;
    }

    ::selection {
      background-color: #1A1A1A;
      color: #00FF00;
    }
  </style>
</head>

<body class="bg-[#FAFAFA]"
  style="background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px); background-size: 32px 32px;">

  <!-- Navigation -->
  <nav class="border-b px-4 py-4 bg-white">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-purple-400 rounded" aria-hidden="true"></div>
        <a href="/" class="font-medium text-gray-800 hover:text-purple-500 transition-colors">Dedar Alam</a>
      </div>
      <div id="navigation-links" class="flex gap-6 text-gray-600">
        <!-- Navigation links will be dynamically inserted here -->
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div id="content" class="p-4 bg-white rounded-lg shadow">
    Loading...
  </div>

  <script src="../js/config.js"></script>
  <script>
    // Function to generate navigation links
    function renderNavigationLinks() {
      const container = document.getElementById('navigation-links');
      const currentPage = window.location.pathname.split('/').pop();

      tags.forEach(tag => {
        const link = document.createElement('a');
        const href = `../${tag.toLowerCase()}.html`;
        link.href = href;
        link.textContent = tag;
        link.className = 'hover:text-purple-500 transition-colors';
        container.appendChild(link);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderNavigationLinks();
      const contentDiv = document.getElementById("content");

      // Get the query parameters from the URL
      const urlParams = new URLSearchParams(window.location.search);
      const contentParam = urlParams.get("content");
      const repoParam = urlParams.get("repo");

      function fetchAndRender(url) {
        contentDiv.innerHTML = '<div class="text-center p-4">Loading from GitHub...</div>';
        fetch(url)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then((markdown) => {
            const htmlContent = marked.parse(markdown);
            contentDiv.innerHTML = htmlContent;
          })
          .catch((error) => {
            console.error("Error fetching from main, trying master...", error);
            // Fallback to master if main fails
            if (url.includes("/main/")) {
              fetchAndRender(url.replace("/main/", "/master/"));
            } else {
              contentDiv.innerHTML = `
                <div class="error-message">
                  Unable to load README from GitHub. Please check the repository URL.
                </div>
              `;
            }
          });
      }

      if (repoParam) {
        // Clean the repo param just in case
        const cleanRepo = repoParam.replace('https://github.com/', '').replace(/\/$/, '');
        const rawUrl = `https://raw.githubusercontent.com/${cleanRepo}/main/README.md`;

        // Update Page Title
        document.title = `${cleanRepo.split('/')[1]} - Documentation`;

        // Add View on GitHub link
        const navContainer = document.querySelector('.max-w-6xl');
        if (navContainer) {
          const githubLink = document.createElement('a');
          githubLink.href = `https://github.com/${cleanRepo}`;
          githubLink.target = "_blank";
          githubLink.className = "text-sm text-purple-600 hover:underline ml-4 font-mono";
          githubLink.innerHTML = "[VIEW ON GITHUB]";
          navContainer.appendChild(githubLink);
        }

        fetchAndRender(rawUrl);

      } else if (contentParam) {
        // Construct the Markdown file name
        const markdownFileName = `${contentParam}.md`;

        // Fetch the corresponding Markdown file
        fetch(markdownFileName)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then((markdown) => {
            // Convert Markdown to HTML using marked.js
            const htmlContent = marked.parse(markdown);

            // Display the rendered content inside the #content div
            contentDiv.innerHTML = htmlContent;
          })
          .catch((error) => {
            // Display an error message in case of failure
            contentDiv.innerHTML = `
            <div class="error-message">
              Unable to load content. Please try again later or check the file name.
            </div>
          `;
            console.error("Error fetching Markdown file:", error);
          });
      } else {
        // Display a message if no content parameter is provided
        contentDiv.innerHTML = `
        <div class="error-message">
          No content specified. Please provide a valid file name or GitHub repository.
        </div>
      `;
      }
    });
  </script>

</body>

</html>
