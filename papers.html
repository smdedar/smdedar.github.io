<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Chakra Petch', sans-serif;
        }

        nav a,
        .nav-item {
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        article p {
            font-family: 'Space Grotesk', sans-serif;
        }

        .text-gray-500 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
    </style>
</head>

<body class="bg-[#FAFAFA]">
    <style>
        ::selection {
            background-color: #1A1A1A;
            color: #00FF00;
        }
    </style>
    <!-- Navigation -->
    <nav class="border-b px-4 py-4 bg-white">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-purple-400 rounded" aria-hidden="true"></div>
                <a href="/" class="font-medium text-gray-800 hover:text-purple-500 transition-colors">Dedar
                    Alam</a>
            </div>
            <div id="navigation-links" class="flex gap-6 text-gray-600">
                <!-- Navigation links will be dynamically inserted here -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto py-8 px-4">
        <div id="papers-container" class="space-y-6">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </main>

    <script src="js/papers.js"></script>
    <script src="js/config.js"></script>
    <script>
        // Improved function to create a paper card
        function createPaperCard(paper) {
            return `
                <article 
                    class="bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" 
                    onclick="openPaperDetails('${paper.url}')"
                    role="button"
                    tabindex="0"
                    aria-label="View details of ${paper.title}"
                    onkeypress="handleKeyPress(event, '${paper.url}')"
                >
                    <h2 class="text-xl font-medium mb-4 group-hover:text-purple-600 transition-colors">${paper.title}</h2>
                    <p class="text-gray-600 mb-4 font-light leading-relaxed">${paper.description}</p>
                    <div class="text-gray-500 text-xs tracking-wider uppercase border-t pt-4 mt-4 border-gray-100">
                        ${paper.date} &middot; ${paper.authors}
                    </div>
                </article>
            `;
        }

        // Render paper cards
        function renderPapers() {
            const container = document.getElementById('papers-container');
            if (!papers || papers.length === 0) {
                container.innerHTML = `
                    <p class="text-gray-500 text-center">No papers available at the moment.</p>
                `;
                return;
            }
            container.innerHTML = papers.map(paper => createPaperCard(paper)).join('');
        }

        // Handle opening paper details
        function openPaperDetails(url) {
            if (url) {
                window.open(url, '_blank');
            } else {
                console.error('Paper URL is not provided.');
            }
        }

        // Handle keyboard navigation for paper cards
        function handleKeyPress(event, url) {
            if (event.key === 'Enter') {
                openPaperDetails(url);
            }
        }

        // Function to generate navigation links
        function renderNavigationLinks() {
            const container = document.getElementById('navigation-links');
            const currentPage = window.location.pathname.split('/').pop();

            tags.forEach(tag => {
                const link = document.createElement('a');
                const href = `${tag.toLowerCase()}.html`;
                link.href = href;
                link.textContent = tag;
                link.className = href === currentPage ? 'underline text-purple-500' : 'hover:text-purple-500 transition-colors';
                container.appendChild(link);
            });
        }

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderPapers();
            renderNavigationLinks();
        });
    </script>
</body>

</html>
