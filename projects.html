<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Chakra Petch', sans-serif;
        }

        nav a,
        .nav-item {
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        article p {
            font-family: 'Space Grotesk', sans-serif;
        }

        .text-gray-500,
        a[aria-label="GitHub Repository"],
        a[aria-label="Live Preview"] {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        /* HUD Nav Styles */
        #navigation-links a {
            position: relative;
            padding-bottom: 2px;
        }

        #navigation-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #a855f7;
            /* Purple-500 */
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        #navigation-links a:hover::after,
        #navigation-links a.active-nav::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>

<body class="bg-[#FAFAFA]"
    style="background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px); background-size: 32px 32px;">
    <style>
        ::selection {
            background-color: #1A1A1A;
            color: #00FF00;
        }
    </style>
    <!-- Navigation -->
    <nav class="border-b px-4 py-4 bg-white">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-purple-400 rounded" aria-hidden="true"></div>
                <a href="/" class="font-medium text-gray-800 hover:text-purple-500 transition-colors">Dedar
                    Alam</a>
            </div>
            <div id="navigation-links" class="flex gap-6 text-gray-600">
                <!-- Navigation links will be dynamically inserted here -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto py-8 px-4">
        <div id="projects-container" class="space-y-6">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </main>

    <script src="js/projects.js"></script>
    <script src="js/config.js"></script>
    <script>
        // Improved function to create a project card
        function createProjectCard(project) {
            let cardUrl = project.url;
            let repoParam = "";

            // Check for valid GitHub URL to generate Docs link
            if (project.github && project.github.includes("github.com/")) {
                const repoPath = project.github.split("github.com/")[1];
                repoParam = `paper/index.html?repo=${repoPath}`;

                // Prioritize the README viewer for the main card click
                // This allows users to read about the project first, regardless of if it has a live link
                cardUrl = repoParam;
            }

            return `
                <article 
                    class="bg-white rounded-r-lg border-l-4 border-l-gray-300 border-y border-r border-gray-200 p-6 hover:border-l-purple-600 hover:-translate-y-1 transition-all duration-300 cursor-pointer group shadow-sm hover:shadow-lg" 
                    onclick="openProjectDetails('${cardUrl}')"
                    role="button"
                    tabindex="0"
                    aria-label="View details of ${project.title}"
                    onkeypress="handleKeyPress(event, '${cardUrl}')"
                >
                    <h2 class="text-xl font-medium mb-4 group-hover:text-purple-600 transition-colors">${project.title}</h2>
                    <p class="text-gray-600 mb-4 font-light leading-relaxed">${project.description}</p>
                    <div class="flex justify-between items-center border-t pt-4 mt-4 border-gray-100">
                        <div class="text-gray-500 text-xs tracking-wider uppercase">
                            ${project.date} &middot; ${project.authors}
                        </div>
                        <div class="flex gap-4 text-xs font-mono">
                            ${repoParam ? `<a href="${repoParam}" class="text-gray-500 hover:text-purple-600 transition-colors" target="_blank">[DOCS]</a>` : ''}
                            <a href="${project.url}" class="text-gray-500 hover:text-purple-600 transition-colors" target="_blank" rel="noopener noreferrer" aria-label="Live Preview">
                                [LIVE]
                            </a>
                            <a href="${project.github || '#'}" class="text-gray-500 hover:text-purple-600 transition-colors" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">
                                [CODE]
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        // Render project cards
        function renderProjects(projectsToRender = projects) {
            const container = document.getElementById('projects-container');

            // Clear container first
            container.innerHTML = '';

            if (!projectsToRender || projectsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center">
                        <p class="text-gray-400 font-mono text-lg">No matches found for query.</p>
                        <button onclick="document.getElementById('search-input').value = ''; renderProjects();" class="mt-4 text-purple-600 hover:text-purple-700 underline font-mono text-sm">Clear Search</button>
                    </div>
                `;
                return;
            }
            container.innerHTML = projectsToRender.map(project => createProjectCard(project)).join('');
        }

        // Search Logic
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = projects.filter(p =>
                p.title.toLowerCase().includes(query) ||
                p.description.toLowerCase().includes(query) ||
                p.authors.toLowerCase().includes(query)
            );
            renderProjects(filtered);
        });

        // Handle opening project details
        function openProjectDetails(url) {
            if (url) {
                window.location.href = url;
            } else {
                console.error('Project URL is not provided.');
            }
        }

        // Handle keyboard navigation for project cards
        function handleKeyPress(event, url) {
            if (event.key === 'Enter') {
                openProjectDetails(url);
            }
        }

        // Function to generate navigation links
        function renderNavigationLinks() {
            const container = document.getElementById('navigation-links');
            const currentPage = window.location.pathname.split('/').pop();

            tags.forEach(tag => {
                const link = document.createElement('a');
                const href = `${tag.toLowerCase()}.html`;
                link.href = href;
                link.textContent = tag;
                link.className = href === currentPage
                    ? 'text-purple-500 font-bold active-nav'
                    : 'text-gray-600 hover:text-purple-500 transition-colors';
                container.appendChild(link);
            });
        }

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            renderNavigationLinks();
        });
    </script>
</body>

</html>
