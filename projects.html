<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Chakra Petch', sans-serif;
        }

        nav a,
        .nav-item {
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        article p {
            font-family: 'Space Grotesk', sans-serif;
        }

        .text-gray-500,
        a[aria-label="GitHub Repository"],
        a[aria-label="Live Preview"] {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="bg-[#FAFAFA]">
    <style>
        ::selection {
            background-color: #1A1A1A;
            color: #00FF00;
        }
    </style>
    <!-- Navigation -->
    <nav class="border-b px-4 py-4 bg-white">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-purple-400 rounded" aria-hidden="true"></div>
                <a href="/" class="font-medium text-gray-800 hover:text-purple-500 transition-colors">Dedar
                    Alam</a>
            </div>
            <div id="navigation-links" class="flex gap-6 text-gray-600">
                <!-- Navigation links will be dynamically inserted here -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto py-8 px-4">
        <div id="projects-container" class="space-y-6">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </main>

    <script src="js/projects.js"></script>
    <script src="js/config.js"></script>
    <script>
        // Improved function to create a project card
        function createProjectCard(project) {
            return `
                <article 
                    class="bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" 
                    onclick="openProjectDetails('${project.url}')"
                    role="button"
                    tabindex="0"
                    aria-label="View details of ${project.title}"
                    onkeypress="handleKeyPress(event, '${project.url}')"
                >
                    <h2 class="text-xl font-medium mb-4 group-hover:text-purple-600 transition-colors">${project.title}</h2>
                    <p class="text-gray-600 mb-4 font-light leading-relaxed">${project.description}</p>
                    <div class="flex justify-between items-center border-t pt-4 mt-4 border-gray-100">
                        <div class="text-gray-500 text-xs tracking-wider uppercase">
                            ${project.date} &middot; ${project.authors}
                        </div>
                        <div class="flex gap-4 text-xs font-mono">
                            <a href="${project.url}" class="text-gray-500 hover:text-purple-600 transition-colors" target="_blank" rel="noopener noreferrer" aria-label="Live Preview">
                                [LIVE]
                            </a>
                            <a href="${project.github || '#'}" class="text-gray-500 hover:text-purple-600 transition-colors" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">
                                [CODE]
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        // Render project cards
        function renderProjects() {
            const container = document.getElementById('projects-container');
            if (!projects || projects.length === 0) {
                container.innerHTML = `
                    <p class="text-gray-500 text-center">No projects available at the moment.</p>
                `;
                return;
            }
            container.innerHTML = projects.map(project => createProjectCard(project)).join('');
        }

        // Handle opening project details
        function openProjectDetails(url) {
            if (url) {
                window.location.href = url;
            } else {
                console.error('Project URL is not provided.');
            }
        }

        // Handle keyboard navigation for project cards
        function handleKeyPress(event, url) {
            if (event.key === 'Enter') {
                openProjectDetails(url);
            }
        }

        // Function to generate navigation links
        function renderNavigationLinks() {
            const container = document.getElementById('navigation-links');
            const currentPage = window.location.pathname.split('/').pop();

            tags.forEach(tag => {
                const link = document.createElement('a');
                const href = `${tag.toLowerCase()}.html`;
                link.href = href;
                link.textContent = tag;
                link.className = href === currentPage ? 'underline text-purple-500' : 'hover:text-purple-500 transition-colors';
                link.className = href === currentPage ? 'underline text-purple-500' : 'hover:text-purple-500 transition-colors';
                container.appendChild(link);
            });
        }

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            renderNavigationLinks();
        });
    </script>
</body>

</html>
